name: orchestrate_app
description: Orchestrate revenue operations application.
publish_to: 'none'
version: 0.2.2+11

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.9.2
  go_router: ^14.8.1
  google_sign_in: ^6.2.1
  http: ^1.2.1
  http_parser: ^4.0.0
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  # Reports the running app version with feedback, so a report says which
  # build it came from without anyone maintaining a constant by hand.
  package_info_plus: ^8.0.0
  file_picker: ^8.0.0
  flutter_svg: ^2.2.4
  # Native store purchase, for iOS and Android only.
  #
  # Brings StoreKit 2 on Apple and the Play Billing Library on Google, which is
  # what both consoles are waiting on: Apple will not ship a subscription except
  # attached to a new app version, and Play will not let one be created at all
  # until a build carrying the billing library is uploaded.
  #
  # The client initiates a purchase and hands the result to the server. It never
  # decides entitlement — a receipt on a device is a claim, and only what Apple
  # or Google confirms to our own backend is evidence.
  in_app_purchase: ^3.2.0

dev_dependencies:
  # Used only by the product-identity conformance test, which decodes the
  # shipped launcher icons and checks them against the canonical mark.
  image: ^4.8.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  msix: ^3.16.13

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo/
    - assets/branding/icons/
    - assets/branding/support/

# Microsoft Store / MSIX packaging.
# identity_name, publisher and publisher_display_name below are the exact
# Microsoft Partner Center reservation for the "Orchestrate Operations"
# product (Product > Product identity) and must match it byte-for-byte.
# The Package Family Name is derived automatically by Windows from
# identity_name + the publisher hash — it is not set here.
msix_config:
  display_name: Orchestrate Operations
  publisher_display_name: Aura Platform LLC
  identity_name: AuraPlatformLLC.Orchestrateoperations
  publisher: CN=3E4027A7-4D4D-4492-B8DE-BBE425E307E5
  msix_version: 0.2.2.0
  store: true
  logo_path: store_assets/source/orchestrate-app-icon-master-1024.png
  capabilities: internetClient
  architecture: x64
  languages: en-us
