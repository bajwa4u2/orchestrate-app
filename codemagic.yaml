# Codemagic CI — iOS build + TestFlight upload for Orchestrate.
# Flutter iOS releases cannot be built on Windows; this runs the build on a
# Codemagic cloud macOS runner.  Docs: https://docs.codemagic.io/yaml/yaml/
#
# ── One-time Codemagic UI setup (before the first run) ───────────────────
#  1. Codemagic > Teams > Integrations > App Store Connect: add your
#     App Store Connect API key (.p8 file + Issuer ID + Key ID).
#     Name the integration EXACTLY:  Orchestrate ASC API Key
#  2. Add this repository as a Codemagic application.
#  3. (After the app record exists in App Store Connect) add an environment
#     variable APP_STORE_APPLE_ID = the numeric Apple ID of the app, in a
#     group named "appstore". Without it the build still works and uses
#     build number 2; with it the build number auto-increments.
#
# Codemagic uses the ASC API key to AUTOMATICALLY create the iOS
# distribution certificate and the App Store provisioning profile for
# com.orchestrateops.app — you do NOT create or upload them by hand.

workflows:
  ios-testflight:
    name: Orchestrate iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Aura Platform LLC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.orchestrateops.app
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - appstore            # provides APP_STORE_APPLE_ID (optional)
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      # Both of these gate the upload. `flutter analyze` exits non-zero on
      # ANY issue, info included — which once meant this workflow would have
      # failed here, and the failure would have read like a signing or
      # toolchain problem rather than a dozen lint infos.
      - name: Static analysis
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      # DOES IT ACTUALLY RUN ON iOS.
      #
      # The only place the shipped iOS binary is exercised before a tester
      # sees it. It runs before the IPA is built, so a failure costs a CI
      # minute rather than a TestFlight cycle.
      #
      # It skips rather than fails when no simulator is available: a step that
      # cannot run should say so, not invent a verdict. With CERT_TOKEN in the
      # environment it also walks the authenticated workspace; without one the
      # first authenticated call is answered 401 and the app correctly signs
      # itself out, so only the platform half runs.
      - name: iOS certification on a simulator
        script: |
          set -e
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone [0-9]' \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available - iOS certification SKIPPED."
            exit 0
          fi
          echo "Certifying on simulator $UDID"
          xcrun simctl boot "$UDID" || true
          if [ -n "$CERT_TOKEN" ]; then
            flutter test integration_test -d "$UDID" \
              --dart-define=CERT_TOKEN="$CERT_TOKEN"
          else
            flutter test integration_test -d "$UDID"
          fi
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # Version + build number come from pubspec.yaml (currently
          # 0.2.3+12) and reach Info.plist through $(FLUTTER_BUILD_NAME) and
          # $(FLUTTER_BUILD_NUMBER). Nothing hardcodes a visible version.
          #
          # Bump pubspec for each release so TestFlight build numbers never
          # collide -- or set APP_STORE_APPLE_ID in the appstore group and let
          # Codemagic increment the build number itself.
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          # API base URL defaults to https://api.orchestrateops.com/v1 at
          # compile time; override only if needed:
          # --dart-define=API_BASE_URL="https://api.orchestrateops.com/v1"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # First submission: leave beta_groups empty and assign testers in
        # App Store Connect, or list internal/external group names here.
        # beta_groups:
        #   - Internal Testers
      email:
        recipients:
          - muhammadsakhawat@gmail.com
        notify:
          success: true
          failure: true
