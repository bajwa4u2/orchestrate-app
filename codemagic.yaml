# Codemagic CI — iOS build + TestFlight upload for Orchestrate.
# Flutter iOS releases cannot be built on Windows; this runs the build on a
# Codemagic cloud macOS runner.  Docs: https://docs.codemagic.io/yaml/yaml/
#
# ── One-time Codemagic UI setup (before the first run) ───────────────────
#  1. Codemagic > Teams > Integrations > App Store Connect: add your
#     App Store Connect API key (.p8 file + Issuer ID + Key ID).
#     The key is registered under Developer Portal and named
#     "Aura Platform LLC", which is what `integrations` below refers to.
#  2. Add this repository as a Codemagic application.
#  3. Nothing else. The app record exists (Orchestrate Operations, Apple ID
#     6772025079) and the version and build number come from pubspec.yaml, so
#     no environment variable group is needed or referenced.
#
# Codemagic uses the ASC API key to AUTOMATICALLY create the iOS
# distribution certificate and the App Store provisioning profile for
# com.orchestrateops.app — you do NOT create or upload them by hand.

workflows:
  # CERTIFY BEFORE YOU SPEND A BUILD NUMBER.
  #
  # The TestFlight workflow already runs the simulator step before signing, so
  # a failure there cannot reach a tester. This exists for a different reason:
  # it CANNOT submit. No App Store Connect integration, no signing block, no
  # publishing section. Running it is a decision to find out whether the iOS
  # binary works, and nothing else.
  #
  # A build number is spent even when processing rejects the upload — build 12
  # was lost that way to ITMS-90683 — so the order is: prove it runs, read the
  # result, then submit.
  ios-simulator-certification:
    name: Orchestrate iOS — simulator certification
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      # PINNED, NOT `stable`.
      #
      # `stable` is whatever Codemagic had installed on the day, so two builds
      # of the same commit can be produced by two different SDKs and nothing
      # records which. That is how a release ends up unable to say what built
      # it. 3.47.2 is the release toolchain for 1.0.0; the local Android and
      # Windows builds use the same revision, and "Record the toolchain and
      # SDK" prints it so the claim is checkable rather than asserted.
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      # WHAT THE TOOLCHAIN ACTUALLY IS.
      #
      # `xcode: latest` is a request, not a fact. Apple requires builds to be
      # made with a current iOS SDK, and the only honest way to state which one
      # we used is to print it out of the machine that used it.
      - name: Record the toolchain and SDK
        script: |
          set -e
          echo "--- xcode ---"
          xcodebuild -version
          echo "--- iOS SDKs available ---"
          xcodebuild -showsdks | grep -i ios || true
          echo "--- flutter ---"
          flutter --version
          echo "--- version under build ---"
          grep '^version:' pubspec.yaml
      - name: Static analysis
        script: flutter analyze --no-fatal-infos
      - name: Unit tests
        script: flutter test
      # Build the iOS binary without signing. This is the step that proves the
      # thing compiles for the platform at all, which no Flutter test does.
      - name: Build unsigned iOS app
        script: flutter build ios --release --no-codesign
      - name: iOS certification on a simulator
        script: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPhone [0-9]' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available - iOS certification SKIPPED."
            exit 0
          fi
          echo "Certifying on simulator $UDID"
          xcrun simctl boot "$UDID" || true
          if [ -n "$CERT_TOKEN" ]; then
            flutter test integration_test -d "$UDID"               --dart-define=CERT_TOKEN="$CERT_TOKEN"
          else
            flutter test integration_test -d "$UDID"
          fi
      # An iPad is a separate layout, not a bigger iPhone, and App Review will
      # open it on one. Skips honestly if the runner has no iPad simulator.
      - name: iPad certification on a simulator
        script: |
          set -e
          UDID=$(xcrun simctl list devices available | grep -m1 -E 'iPad' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPad simulator available - iPad certification SKIPPED."
            exit 0
          fi
          echo "Certifying on iPad simulator $UDID"
          xcrun simctl boot "$UDID" || true
          flutter test integration_test -d "$UDID"
    artifacts:
      - build/ios/iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: Orchestrate iOS — TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      app_store_connect: Aura Platform LLC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.orchestrateops.app
      # PINNED, NOT `stable`.
      #
      # `stable` is whatever Codemagic had installed on the day, so two builds
      # of the same commit can be produced by two different SDKs and nothing
      # records which. That is how a release ends up unable to say what built
      # it. 3.47.2 is the release toolchain for 1.0.0; the local Android and
      # Windows builds use the same revision, and "Record the toolchain and
      # SDK" prints it so the claim is checkable rather than asserted.
      flutter: 3.47.2
      xcode: latest
      cocoapods: default
      # NO VARIABLE GROUP.
      #
      # This declared a group named "appstore", for an APP_STORE_APPLE_ID that
      # nothing in the build reads — the version and build number come from
      # pubspec.yaml through $(FLUTTER_BUILD_NAME) and $(FLUTTER_BUILD_NUMBER).
      # The group was never created, and Codemagic fails a build that asks for
      # a group it cannot find, so this would have stopped the run before the
      # first script.
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      # Both of these gate the upload. `flutter analyze` exits non-zero on
      # ANY issue, info included — which once meant this workflow would have
      # failed here, and the failure would have read like a signing or
      # toolchain problem rather than a dozen lint infos.
      #
      # That was fixed by clearing the infos, which left the trap loaded: the
      # next style hint anybody introduces turns into a red build three steps
      # before signing, and reads like a certificate problem. --no-fatal-infos
      # takes the trap out while keeping the gate. Errors and warnings are
      # still fatal, which is what this step is for; a lint suggestion is not
      # a reason to refuse to ship. The Aura side reached the same conclusion
      # independently after losing a build to it.
      #
      # The tree is at zero issues today, so this changes nothing now. It
      # changes what happens the first time it is not.
      - name: Static analysis
        script: flutter analyze --no-fatal-infos
      - name: Unit tests
        script: flutter test
      # DOES IT ACTUALLY RUN ON iOS.
      #
      # The only place the shipped iOS binary is exercised before a tester
      # sees it. It runs before the IPA is built, so a failure costs a CI
      # minute rather than a TestFlight cycle.
      #
      # It skips rather than fails when no simulator is available: a step that
      # cannot run should say so, not invent a verdict. With CERT_TOKEN in the
      # environment it also walks the authenticated workspace; without one the
      # first authenticated call is answered 401 and the app correctly signs
      # itself out, so only the platform half runs.
      - name: iOS certification on a simulator
        script: |
          set -e
          UDID=$(xcrun simctl list devices available \
            | grep -m1 -E 'iPhone [0-9]' \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "No iPhone simulator available - iOS certification SKIPPED."
            exit 0
          fi
          echo "Certifying on simulator $UDID"
          xcrun simctl boot "$UDID" || true
          if [ -n "$CERT_TOKEN" ]; then
            flutter test integration_test -d "$UDID" \
              --dart-define=CERT_TOKEN="$CERT_TOKEN"
          else
            flutter test integration_test -d "$UDID"
          fi
      - name: Install CocoaPods dependencies
        script: find . -name "Podfile" -execdir pod install \;
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          # Version + build number come from pubspec.yaml (currently
          # 0.2.3+13) and reach Info.plist through $(FLUTTER_BUILD_NAME) and
          # $(FLUTTER_BUILD_NUMBER). Nothing hardcodes a visible version.
          #
          # Bump pubspec for each release so TestFlight build numbers never
          # collide -- including with a build that FAILED processing, which
          # still consumes its number. 12 was spent that way; 13 is clear.
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
          # API base URL defaults to https://api.orchestrateops.com/v1 at
          # compile time; override only if needed:
          # --dart-define=API_BASE_URL="https://api.orchestrateops.com/v1"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # First submission: leave beta_groups empty and assign testers in
        # App Store Connect, or list internal/external group names here.
        # beta_groups:
        #   - Internal Testers
      email:
        recipients:
          - muhammadsakhawat@gmail.com
        notify:
          success: true
          failure: true
