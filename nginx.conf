server {
  listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Machine endpoints must never fall through to the Flutter SPA shell.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /indexnow-key.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ANDROID APP LINKS. Android fetches this file itself and expects JSON; the
    # SPA fallback below would hand it index.html with HTTP 200 instead, which
    # is worse than a 404 because a naive check passes while verification
    # silently fails. `try_files $uri =404` makes a missing file say so.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # UNIVERSAL LINKS. Apple fetches this extensionless file and requires JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

  # Flutter web ships a service worker plus non-content-hashed entry points
  # (index.html, flutter_bootstrap.js, flutter_service_worker.js, version.json).
  # If those are cached, a new deploy is shadowed by the previously cached app
  # shell — the build is live but visitors keep seeing the old bundle until the
  # service worker eventually updates. Force revalidation on every load so each
  # deploy is picked up immediately. main.dart.js is cache-busted by the
  # Dockerfile; assets are handled by the /assets/ rule below, because Flutter
  # does not content-hash them.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  # Flutter does NOT content-hash its assets, whatever the note above assumed:
  # they keep the same URL across every deploy. The icon font is now stamped
  # with the build id by the Dockerfile, so staleness is solved by the URL
  # changing rather than by refusing to cache.
  #
  # Which matters, because the font is 1.6MB. An earlier attempt here set
  # no-cache and forced a revalidation of it on every single page load — a
  # regression far worse than the bug it was chasing. Cache it, briefly enough
  # that the un-stamped assets beside it still refresh quickly.
  location /assets/ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
