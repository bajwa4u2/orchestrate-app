server {
  listen 8080;

    root /usr/share/nginx/html;
    index index.html;

    # Machine endpoints must never fall through to the Flutter SPA shell.
    location = /robots.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location = /indexnow-key.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # INVESTOR SURFACES.
    # Static HTML, served ahead of the SPA fallback. X-Robots-Tag repeats the in-document
    # <meta name="robots"> so the directive survives even if a crawler fetches without parsing,
    # and so it applies to the shared CSS and any future asset under /shared/.
    #
    # Deliberately NOT added to robots.txt as Disallow: a disallowed page can never be crawled,
    # so the noindex directive is never seen, and the URL can still surface from external links.
    # Allow the crawl, refuse the index. Both paths are also absent from sitemap.xml.

    location = /deck {
    add_header X-Robots-Tag "noindex, nofollow" always;
    # SURVIVES A BAD DEPLOY. These two pages are the frozen basis of an
    # investor representation, and they sit on the same container as product
    # code that ships several times a day. `no-cache` told Cloudflare never to
    # keep a copy, so every request reached the origin and their availability
    # was welded to container health — a rolling swap or a crash loop took the
    # deck down while a partner might be reading it.
    #
    # stale-if-error is the operative clause: the edge serves the last good copy
    # while the origin is mid-deploy or erroring. Bounded to an HOUR rather than
    # the week a marketing page would take, because the failure modes are not
    # symmetric here. A 5xx is visibly broken; a silently superseded deck is
    # quietly wrong, and a partner cannot tell the difference. On a service that
    # deploys this often, an outage lasting past an hour gets noticed.
    #
    # stale-while-revalidate makes ordinary deploy windows invisible, and
    # max-age keeps an edit propagating within five minutes.
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=3600" always;
    default_type text/html;
    try_files /deck/index.html =404;
    }

    location = /deck/ {
    return 301 /deck;
    }

    location = /demo {
    add_header X-Robots-Tag "noindex, nofollow" always;
    # SURVIVES A BAD DEPLOY. These two pages are the frozen basis of an
    # investor representation, and they sit on the same container as product
    # code that ships several times a day. `no-cache` told Cloudflare never to
    # keep a copy, so every request reached the origin and their availability
    # was welded to container health — a rolling swap or a crash loop took the
    # deck down while a partner might be reading it.
    #
    # stale-if-error is the operative clause: the edge serves the last good copy
    # while the origin is mid-deploy or erroring. Bounded to an HOUR rather than
    # the week a marketing page would take, because the failure modes are not
    # symmetric here. A 5xx is visibly broken; a silently superseded deck is
    # quietly wrong, and a partner cannot tell the difference. On a service that
    # deploys this often, an outage lasting past an hour gets noticed.
    #
    # stale-while-revalidate makes ordinary deploy windows invisible, and
    # max-age keeps an edit propagating within five minutes.
    add_header Cache-Control "public, max-age=300, stale-while-revalidate=86400, stale-if-error=3600" always;
    default_type text/html;
    try_files /demo/index.html =404;
    }

    location = /demo/ {
    return 301 /demo;
    }

    # Shared stylesheet for the two investor surfaces. Exact match so it cannot shadow the
    # Flutter /assets/ rule or anything the application serves.
    location = /shared/workspace.css {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "public, max-age=300" always;
        default_type text/css;
        try_files $uri =404;
    }

    location = /shared/orchestrate.css {
    add_header X-Robots-Tag "noindex" always;
    add_header Cache-Control "public, max-age=300" always;
    default_type text/css;
    try_files $uri =404;
    }

    # ANDROID APP LINKS. Android fetches this file itself and expects JSON; the
    # SPA fallback below would hand it index.html with HTTP 200 instead, which
    # is worse than a 404 because a naive check passes while verification
    # silently fails. `try_files $uri =404` makes a missing file say so.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # UNIVERSAL LINKS. Apple fetches this extensionless file and requires JSON.
    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

  # Flutter web ships a service worker plus non-content-hashed entry points
  # (index.html, flutter_bootstrap.js, flutter_service_worker.js, version.json).
  # If those are cached, a new deploy is shadowed by the previously cached app
  # shell — the build is live but visitors keep seeing the old bundle until the
  # service worker eventually updates. Force revalidation on every load so each
  # deploy is picked up immediately. main.dart.js is cache-busted by the
  # Dockerfile; assets are handled by the /assets/ rule below, because Flutter
  # does not content-hash them.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  # Flutter does NOT content-hash its assets, whatever the note above assumed:
  # they keep the same URL across every deploy. The icon font is now stamped
  # with the build id by the Dockerfile, so staleness is solved by the URL
  # changing rather than by refusing to cache.
  #
  # Which matters, because the font is 1.6MB. An earlier attempt here set
  # no-cache and forced a revalidation of it on every single page load — a
  # regression far worse than the bug it was chasing. Cache it, briefly enough
  # that the un-stamped assets beside it still refresh quickly.
  location /assets/ {
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
