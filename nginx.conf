server {
  listen 8080;

  root /usr/share/nginx/html;
  index index.html;

  # Flutter web ships a service worker plus non-content-hashed entry points
  # (index.html, flutter_bootstrap.js, flutter_service_worker.js, version.json).
  # If those are cached, a new deploy is shadowed by the previously cached app
  # shell — the build is live but visitors keep seeing the old bundle until the
  # service worker eventually updates. Force revalidation on every load so each
  # deploy is picked up immediately. The service-worker manifest still
  # content-hashes the heavy assets (main.dart.js, CanvasKit, fonts), so this
  # only costs a cheap freshness check, not a full re-download.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /flutter_bootstrap.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /flutter_service_worker.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location = /version.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}